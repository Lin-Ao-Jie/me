name: Build DataNetShare Adaptive

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-datanetshare.yml"
      - "patches/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout controller repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure runner Android SDK
        shell: bash
        run: |
          SDKROOT="/usr/local/lib/android/sdk"
          test -d "$SDKROOT"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          echo "$SDKROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDKROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDKROOT/emulator" >> "$GITHUB_PATH"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$SDKROOT/cmdline-tools/16.0/bin/sdkmanager"; fi
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Download DataNetShare source
        run: |
          curl -L --fail --retry 3 https://raw.githubusercontent.com/Keggin-AI/DataNetShare/main/datnet-share-v5-final.zip -o datnet-share-v5-final.zip
          rm -rf upstream
          mkdir upstream
          unzip -q datnet-share-v5-final.zip -d upstream
          find upstream -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print

      - name: Locate Gradle project
        id: locate
        shell: bash
        run: |
          ROOT="$(find "$GITHUB_WORKSPACE/upstream" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"
          test -n "$ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Apply project patches
        run: |
          if [ -f patches/apply.sh ]; then
            chmod +x patches/apply.sh
            ./patches/apply.sh "${{ steps.locate.outputs.root }}"
          else
            echo "No patches yet; building upstream baseline."
          fi

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.root }}
        run: |
          gradle assembleDebug --stacktrace --no-daemon --no-build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DataNetShare-adaptive-debug
          path: upstream/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
