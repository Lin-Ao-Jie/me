name: Build DataNetShare Adaptive

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-datanetshare.yml"
      - "patches/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout controller repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            SDKROOT="$ANDROID_SDK_ROOT"
          elif [ -n "${ANDROID_HOME:-}" ]; then
            SDKROOT="$ANDROID_HOME"
          else
            SDKROOT="$HOME/android-sdk"
          fi
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          echo "$SDKROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDKROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Download DataNetShare source
        run: |
          curl -L --fail --retry 3 https://raw.githubusercontent.com/Keggin-AI/DataNetShare/main/datnet-share-v5-final.zip -o datnet-share-v5-final.zip
          rm -rf upstream
          mkdir upstream
          unzip -q datnet-share-v5-final.zip -d upstream
          find upstream -maxdepth 6 -name gradlew -type f -print

      - name: Apply project patches
        run: |
          if [ -f patches/apply.sh ]; then
            chmod +x patches/apply.sh
            ./patches/apply.sh "$GITHUB_WORKSPACE/upstream"
          else
            echo "No patches yet; building upstream baseline."
          fi

      - name: Locate Gradle project
        id: locate
        run: |
          ROOT="$(find "$GITHUB_WORKSPACE/upstream" -name gradlew -type f -print -quit | xargs -r dirname)"
          test -n "$ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.root }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DataNetShare-adaptive-debug
          path: upstream/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
